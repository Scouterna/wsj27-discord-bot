apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-wsj27-bot
  labels:
    app: discord-wsj27-bot
spec:
  # Exactly one. This is a discord.js *gateway* bot: a second instance opens its
  # own gateway session, receives the same events, and answers every command
  # twice.
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: discord-wsj27-bot
  strategy:
    # Recreate, not RollingUpdate: maxSurge would briefly run two instances,
    # which is exactly what must not happen. The cost is a few seconds of
    # downtime per deploy, which is invisible here — there is no inbound
    # traffic, and Discord queues gateway events across a short reconnect.
    type: Recreate
  template:
    metadata:
      labels:
        app: discord-wsj27-bot
    spec:
      # src/index.js handles SIGTERM with client.destroy(), so the gateway
      # session closes cleanly instead of timing out.
      terminationGracePeriodSeconds: 30
      # This repository is private, so its GHCR package is private too —
      # package visibility follows repository visibility. Unlike the ScoutID
      # bot, whose source is public anyway, a public image here would expose
      # code that is otherwise closed.
      #
      # KNOWN COMPROMISE, accepted deliberately: `ghcr-pull` holds a personal
      # PAT belonging to hakan-persson, shared with scoutview. This bot's
      # ability to *start* therefore depends on one person's token — not
      # visibly, because running pods keep working from the cached image. It
      # breaks only when a pod reschedules, which may be weeks later and will
      # take scoutview down at the same time.
      #
      # Accepted because this cluster is being replaced within a year, where
      # the credential is solved properly. If that timeline slips, replace this
      # with a dedicated read:packages token or an org-owned machine account.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: bot
          # Tag is set by CI. Never :latest — it makes rollouts and
          # `rollout undo` ambiguous.
          image: ghcr.io/scouterna/wsj27-discord-bot:PLACEHOLDER-set-by-ci
          envFrom:
            - configMapRef:
                name: discord-wsj27-bot-config
            # Created imperatively; not part of this kustomization.
            - secretRef:
                name: discord-wsj27-bot-secrets
          # Matches what the Container App was given (0.25 CPU / 0.5Gi), sized
          # against 93-97% actual node memory. Do not oversize.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          # No probes: the bot serves no HTTP, so there is nothing to poll.
          # Kubernetes restarts it if the process exits; discord.js handles
          # gateway reconnects itself.
          #
          # No volume either. An Azure Files share was mounted at /persistent
          # for claims.json until the name-claiming feature was removed on
          # 2026-08-17; the share and its storage account were deleted with it.
          # The bot writes nothing now.
